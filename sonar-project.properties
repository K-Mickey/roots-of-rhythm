sonar.organization=kokmickey
sonar.projectKey=K-Mickey_roots-of-rhythm
sonar.projectName=Roots of Rhythm
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/api/schema.d.ts
sonar.coverage.exclusions=frontend/src/api/schema.d.ts

sonar.python.version=3.14
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
