name: roots-of-rhythm

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roots_of_rhythm}
      POSTGRES_USER: ${POSTGRES_USER:-roots}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roots}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-roots}:${POSTGRES_PASSWORD:-roots}@postgres:5432/${POSTGRES_DB:-roots_of_rhythm}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_RELOAD: "false"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)",
        ]
      interval: 3s
      timeout: 3s
      retries: 15

  frontend:
    build:
      context: frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
