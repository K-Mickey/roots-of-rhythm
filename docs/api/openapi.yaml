openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Swing Music Story Public API
  version: 0.8.0
  description: Public read API defined by accepted project specifications.
tags:
  - name: Genres
    description: Published Genre read models.
  - name: Performers
    description: Published Performer (Person) read models.
  - name: Groups
    description: Published Group read models.
  - name: Songs
    description: Published Song (MusicalWork) read models.
  - name: Recordings
    description: Published Recording read models.
paths:
  /api/v1/genres:
    get:
      tags: [Genres]
      operationId: listPublishedGenres
      summary: List published Genres
      description: >-
        Returns identity summaries of all currently published Genres, ordered by
        canonical name. Draft, archived, and deleted Genres are omitted. An empty
        list is a successful result.
      security: []
      responses:
        "200":
          description: Ordered published Genre summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreListResponse"
              examples:
                seed:
                  value:
                    items:
                      - id: 01a0147a-8508-74b7-9689-e7c079b95327
                        name: Jazz
                      - id: 01a0147a-8508-74b7-9689-e7c272039bac
                        name: Jump Blues
                      - id: 01a0147a-8508-74b7-9689-e7c133e4e7a5
                        name: Swing
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/genres/{genre_id}:
    get:
      tags: [Genres]
      operationId: getPublishedGenreOverview
      summary: Get a published Genre overview
      description: >-
        Returns the required identity and overview projection. Unknown, malformed,
        draft, and archived Genre identifiers are intentionally indistinguishable.
      security: []
      parameters:
        - $ref: "#/components/parameters/GenreId"
      responses:
        "200":
          description: Public Genre overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreOverviewResponse"
              examples:
                swing:
                  value:
                    id: 5d6f4f68-2f7f-4a70-a8f1-df935dcbdb5c
                    name: Swing
                    definition: >-
                      Направление джаза, в котором ритмическая пульсация,
                      оркестровые аранжировки и импровизирующие солисты стали
                      основой массовой танцевальной музыки Swing Era.
                    primary_image: null
                    period:
                      label: 1930-е — 1940-е
                      start: {year: 1930, precision: decade}
                      end: {year: 1940, precision: decade}
                    geography_or_origin:
                      summary: Соединённые Штаты Америки
                    historical_context: >-
                      В 1930-е годы большие джазовые оркестры и танцевальные площадки
                      сделали Swing центральной частью американской популярной музыки.
                    formation: >-
                      Swing сформировался внутри джазовой традиции по мере развития
                      больших составов, аранжировок и ритмического подхода.
                    characteristic_features:
                      - Устойчивая swing-пульсация
                      - Риффовые и секционные оркестровые аранжировки
        "404":
          $ref: "#/components/responses/GenreNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/genres/{genre_id}/relations:
    get:
      tags: [Genres]
      operationId: getPublishedGenreRelations
      summary: Get published relations for a Genre
      description: >-
        Returns all currently visible relation cards as one bounded projection.
        It does not create one request per Claim.
      security: []
      parameters:
        - $ref: "#/components/parameters/GenreId"
      responses:
        "200":
          description: Ordered public Genre relations; an empty array is a successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreRelationsResponse"
              examples:
                swing:
                  value:
                    genre_id: 5d6f4f68-2f7f-4a70-a8f1-df935dcbdb5c
                    relations:
                      - id: f773ba22-1c50-4f53-9c46-e809cc3902d1
                        related_genre:
                          id: 5812ed94-b7c0-4790-b7f0-b6b09081ab52
                          name: Jazz
                        relation_type: developed_from
                        perspective: subject
                        explanation: >-
                          Swing сформировался внутри американской джазовой традиции
                          на основе развития оркестровых аранжировок и ритмической организации.
                        temporal_context:
                          label: конец 1920-х — 1930-е
                          start: {year: 1920, precision: late_decade}
                          end: {year: 1930, precision: decade}
                        geographic_context:
                          summary: Соединённые Штаты Америки
                        evidence_status: supported
                        evidence_references:
                          - source_id: 43c0a5f3-e885-4f33-b9ae-d9ffec1f5f14
                            role: supports
                            locator_text: Jazz history overview; Jazz Age and Swing Era
                            external_url: https://music.si.edu/story/jazz
        "404":
          $ref: "#/components/responses/GenreNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/genres/{genre_id}/sources:
    get:
      tags: [Genres]
      operationId: getPublishedGenreSources
      summary: Get the public bibliography for a Genre page
      description: >-
        Returns a deduplicated bibliography for all currently public Evidence
        references used by the Genre page. It does not create one request per Source.
      security: []
      parameters:
        - $ref: "#/components/parameters/GenreId"
      responses:
        "200":
          description: Public Genre bibliography; an empty array is a successful result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenreSourcesResponse"
              examples:
                swing:
                  value:
                    genre_id: 5d6f4f68-2f7f-4a70-a8f1-df935dcbdb5c
                    sources:
                      - id: 43c0a5f3-e885-4f33-b9ae-d9ffec1f5f14
                        title: "Jazz: An Introduction to the History and Legends Behind America's Music"
                        author: null
                        responsible_organization: Smithsonian Music
                        publication: Smithsonian Music
                        publication_date: null
                        external_url: https://music.si.edu/story/jazz
        "404":
          $ref: "#/components/responses/GenreNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/performers:
    get:
      tags: [Performers]
      operationId: listPublishedPerformers
      summary: List published Performers
      description: >-
        Returns identity summaries of all currently published Performers, ordered by
        canonical name. Draft, archived, and deleted Persons are omitted. An empty
        list is a successful result.
      security: []
      responses:
        "200":
          description: Ordered published Performer summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformerListResponse"
              examples:
                seed:
                  value:
                    items:
                      - id: 01a01a72-1be5-7542-b935-47f33d83c2ab
                        name: Benny Goodman
                      - id: 01a01a72-1be5-7542-b935-47f5372c5a61
                        name: Big Joe Turner
                      - id: 01a01a72-1be4-763d-8892-9d922967d97d
                        name: Charlie Parker
                      - id: 01a01a72-1be5-7542-b935-47f2b3e1b5a3
                        name: Count Basie
                      - id: 01a01a72-1be5-7542-b935-47f617f2cfd3
                        name: Louis Armstrong
                      - id: 01a01a72-1be5-7542-b935-47f4d3a8b6a4
                        name: Louis Jordan
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/performers/{performer_id}:
    get:
      tags: [Performers]
      operationId: getPublishedPerformerOverview
      summary: Get a published Performer overview
      description: >-
        Returns every public Person content field plus primary image and assigned
        Genres. Editorial status, deleted flags, and timestamps are omitted.
        Unknown, malformed, draft, and archived identifiers are intentionally
        indistinguishable.
      security: []
      parameters:
        - $ref: "#/components/parameters/PerformerId"
      responses:
        "200":
          description: Public Performer overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformerOverviewResponse"
              examples:
                armstrong:
                  value:
                    id: 01a01a72-1be5-7542-b935-47f617f2cfd3
                    name: Louis Armstrong
                    aliases: []
                    biography: null
                    birth_date: null
                    death_date: null
                    external_identities: []
                    primary_image: null
                    genres:
                      - id: 01a0147a-8508-74b7-9689-e7c079b95327
                        name: Jazz
                      - id: 01a0147a-8508-74b7-9689-e7c133e4e7a5
                        name: Swing
        "404":
          $ref: "#/components/responses/PerformerNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/groups:
    get:
      tags: [Groups]
      operationId: listPublishedGroups
      summary: List published Groups
      description: >-
        Returns identity summaries of all currently published Groups, ordered by
        canonical name. Draft, archived, and deleted Groups are omitted. An empty
        list is a successful result.
      security: []
      responses:
        "200":
          description: Ordered published Group summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
              examples:
                seed:
                  value:
                    items:
                      - id: 01a01a72-2c01-7000-8000-000000000001
                        name: Benny Goodman Orchestra
                      - id: 01a01a72-2c01-7000-8000-000000000002
                        name: Charlie Parker Quintet
                      - id: 01a01a72-2c01-7000-8000-000000000003
                        name: Count Basie Orchestra
                      - id: 01a01a72-2c01-7000-8000-000000000004
                        name: Tympany Five
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/groups/{group_id}:
    get:
      tags: [Groups]
      operationId: getPublishedGroupOverview
      summary: Get a published Group overview
      description: >-
        Returns public Group content plus members and assigned Genres.
        Editorial status, deleted flags, timestamps, evidence, and provenance
        are omitted. Unknown, malformed, draft, and archived identifiers are
        intentionally indistinguishable.
      security: []
      parameters:
        - $ref: "#/components/parameters/GroupId"
      responses:
        "200":
          description: Public Group overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupOverviewResponse"
              examples:
                basie:
                  value:
                    id: 01a01a72-2c01-7000-8000-000000000003
                    name: Count Basie Orchestra
                    aliases: []
                    description: null
                    period:
                      start: null
                      end: null
                    primary_image: null
                    genres:
                      - id: 01a0147a-8508-74b7-9689-e7c133e4e7a5
                        name: Swing
                    members:
                      - id: 01a01a72-1be5-7542-b935-47f2b3e1b5a3
                        name: Count Basie
                        period:
                          start: null
                          end: null
                        roles_or_instruments: [piano, bandleader]
        "404":
          $ref: "#/components/responses/GroupNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/songs:
    get:
      tags: [Songs]
      operationId: listPublishedSongs
      summary: List published Songs
      description: >-
        Returns identity summaries of all currently published MusicalWorks, ordered by
        canonical title. Draft, archived, and deleted Works are omitted. An empty
        list is a successful result.
      security: []
      responses:
        "200":
          description: Ordered published Song summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongListResponse"
              examples:
                seed:
                  value:
                    items:
                      - id: 01a01a72-3c01-7000-8000-000000000001
                        name: Sixteen Tons
                      - id: 01a01a72-3c01-7000-8000-000000000002
                        name: One O'Clock Jump
                      - id: 01a01a72-3c01-7000-8000-000000000003
                        name: Ornithology
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/songs/{song_id}:
    get:
      tags: [Songs]
      operationId: getPublishedSongOverview
      summary: Get a published Song overview
      description: >-
        Returns public MusicalWork content plus credits, classifications, related Works
        and rights-aware LyricsVersion projections. Editorial status, deleted flags,
        timestamps, evidence, and provenance are omitted. Unknown, malformed, draft,
        and archived identifiers are intentionally indistinguishable.
      security: []
      parameters:
        - $ref: "#/components/parameters/SongId"
      responses:
        "200":
          description: Public Song overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongOverviewResponse"
              examples:
                sixteen_tons:
                  value:
                    id: 01a01a72-3c01-7000-8000-000000000001
                    name: Sixteen Tons
                    aliases: []
                    description: null
                    period:
                      start: null
                      end: null
                    external_identities: []
                    credits:
                      - person:
                          id: 01a01a72-3b01-7000-8000-000000000001
                          name: Merle Travis
                        role: composer
                        credited_as: null
                      - person:
                          id: 01a01a72-3b01-7000-8000-000000000001
                          name: Merle Travis
                        role: lyricist
                        credited_as: null
                    classifications: []
                    related_works: []
                    lyrics_versions: []
        "404":
          $ref: "#/components/responses/SongNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/recordings/{recording_id}:
    get:
      tags: [Recordings]
      operationId: getPublishedRecordingOverview
      summary: Get a published Recording overview
      security: []
      parameters:
        - name: recording_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/PublicId"}
      responses:
        "200":
          description: Public Recording overview.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RecordingOverviewResponse"}
        "404":
          description: Recording is absent or not publicly visible.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "500": {$ref: "#/components/responses/InternalError"}
components:
  parameters:
    GenreId:
      name: genre_id
      in: path
      required: true
      description: Stable opaque Genre identifier. Clients must not derive meaning from it.
      schema:
        $ref: "#/components/schemas/PublicId"
    PerformerId:
      name: performer_id
      in: path
      required: true
      description: Stable opaque Performer identifier (Person). Clients must not derive meaning from it.
      schema:
        $ref: "#/components/schemas/PublicId"
    GroupId:
      name: group_id
      in: path
      required: true
      description: Stable opaque Group identifier. Clients must not derive meaning from it.
      schema:
        $ref: "#/components/schemas/PublicId"
    SongId:
      name: song_id
      in: path
      required: true
      description: Stable opaque Song identifier (MusicalWork). Clients must not derive meaning from it.
      schema:
        $ref: "#/components/schemas/PublicId"
  responses:
    GenreNotFound:
      description: Genre is absent or not publicly visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: GENRE_NOT_FOUND
            message: Материал не найден.
            details: null
            request_id: 01K2V3A5J2P9M3EVWQ3E7G4C6X
    PerformerNotFound:
      description: Performer is absent or not publicly visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: PERFORMER_NOT_FOUND
            message: Материал не найден.
            details: null
            request_id: 01K2V3A5J2P9M3EVWQ3E7G4C6X
    GroupNotFound:
      description: Group is absent or not publicly visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: GROUP_NOT_FOUND
            message: Материал не найден.
            details: null
            request_id: 01K2V3A5J2P9M3EVWQ3E7G4C6X
    SongNotFound:
      description: Song is absent or not publicly visible.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: SONG_NOT_FOUND
            message: Материал не найден.
            details: null
            request_id: 01K2V3A5J2P9M3EVWQ3E7G4C6X
    InternalError:
      description: The requested projection could not be assembled safely.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: INTERNAL_ERROR
            message: Не удалось загрузить материал.
            details: null
            request_id: 01K2V3A5J2P9M3EVWQ3E7G4C6X
  schemas:
    PublicId:
      type: string
      minLength: 1
      description: Stable opaque identifier whose internal format is not a client contract.
    NullableText:
      oneOf:
        - type: string
        - type: "null"
    GenreListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Published Genre summaries ordered by canonical name.
          items: {$ref: "#/components/schemas/GenreSummary"}
    GroupListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Published Group summaries ordered by canonical name.
          items: {$ref: "#/components/schemas/GroupSummary"}
    GroupSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        name: {type: string, minLength: 1}
    GroupPeriodView:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          oneOf:
            - $ref: "#/components/schemas/TemporalBound"
            - type: "null"
        end:
          oneOf:
            - $ref: "#/components/schemas/TemporalBound"
            - type: "null"
    GroupMemberView:
      type: object
      additionalProperties: false
      required: [id, name, period, roles_or_instruments]
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        name: {type: string, minLength: 1}
        period: {$ref: "#/components/schemas/GroupPeriodView"}
        roles_or_instruments:
          type: array
          description: Optional role or instrument labels; may be empty. Not an instrument catalog.
          items: {type: string, minLength: 1}
    GroupOverviewResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - aliases
        - description
        - period
        - primary_image
        - genres
        - members
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        name: {type: string, minLength: 1}
        aliases:
          type: array
          description: Alternate names; may be empty. Does not include the canonical name.
          items: {type: string, minLength: 1}
        description: {$ref: "#/components/schemas/NullableText"}
        period: {$ref: "#/components/schemas/GroupPeriodView"}
        primary_image:
          oneOf:
            - $ref: "#/components/schemas/PublicImageView"
            - type: "null"
        genres:
          type: array
          description: Published Genre summaries assigned to the Group, ordered by canonical name.
          items: {$ref: "#/components/schemas/GenreSummary"}
        members:
          type: array
          description: Published memberships of published Performers, ordered by person name.
          items: {$ref: "#/components/schemas/GroupMemberView"}
    SongListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Published Song summaries ordered by canonical title.
          items: {$ref: "#/components/schemas/SongSummary"}
    SongSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        name: {type: string, minLength: 1}
    SongPeriodView:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          oneOf:
            - $ref: "#/components/schemas/TemporalBound"
            - type: "null"
        end:
          oneOf:
            - $ref: "#/components/schemas/TemporalBound"
            - type: "null"
    SongWorkCreditView:
      type: object
      additionalProperties: false
      required: [person, role, credited_as]
      properties:
        person: {$ref: "#/components/schemas/PerformerSummary"}
        role: {$ref: "#/components/schemas/WorkCreditRole"}
        credited_as: {$ref: "#/components/schemas/NullableText"}
    RelatedWorkView:
      type: object
      additionalProperties: false
      required: [relation_type, work]
      properties:
        relation_type: {$ref: "#/components/schemas/WorkRelationType"}
        work: {$ref: "#/components/schemas/SongSummary"}
    LyricsVersionSummary:
      type: object
      additionalProperties: false
      required: [id, language_tag, label]
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        language_tag: {type: string, minLength: 1}
        label: {$ref: "#/components/schemas/NullableText"}
    LyricsVersionRelationView:
      type: object
      additionalProperties: false
      required: [relation_type, version]
      properties:
        relation_type: {$ref: "#/components/schemas/LyricsVersionRelationType"}
        version: {$ref: "#/components/schemas/LyricsVersionSummary"}
    SongLyricsVersionView:
      type: object
      additionalProperties: false
      required:
        - id
        - language_tag
        - label
        - usage_kind
        - creation_method
        - body
        - body_unavailable_reason
        - credits
        - relations
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        language_tag: {type: string, minLength: 1}
        label: {$ref: "#/components/schemas/NullableText"}
        usage_kind: {$ref: "#/components/schemas/LyricsUsageKind"}
        creation_method: {$ref: "#/components/schemas/LyricsCreationMethod"}
        body: {$ref: "#/components/schemas/NullableText"}
        body_unavailable_reason: {$ref: "#/components/schemas/NullableText"}
        credits:
          type: array
          description: Published credits with published Performers; may be empty.
          items: {$ref: "#/components/schemas/SongWorkCreditView"}
        relations:
          type: array
          description: Published relations to other LyricsVersions; may be empty.
          items: {$ref: "#/components/schemas/LyricsVersionRelationView"}
    SongOverviewResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - aliases
        - description
        - period
        - external_identities
        - credits
        - classifications
        - related_works
        - lyrics_versions
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        name: {type: string, minLength: 1}
        aliases:
          type: array
          description: Alternate names; may be empty. Does not include the canonical title.
          items: {type: string, minLength: 1}
        description: {$ref: "#/components/schemas/NullableText"}
        period: {$ref: "#/components/schemas/SongPeriodView"}
        external_identities:
          type: array
          description: External catalog identifiers; may be empty.
          items: {$ref: "#/components/schemas/ExternalIdentityView"}
        credits:
          type: array
          description: Published WorkCredits with published Performers; may be empty.
          items: {$ref: "#/components/schemas/SongWorkCreditView"}
        classifications:
          type: array
          description: Published Genre summaries assigned to the Work, ordered by canonical name.
          items: {$ref: "#/components/schemas/GenreSummary"}
        related_works:
          type: array
          description: >-
            Published directed WorkRelations where this song is the source
            (for example translation_of pointing at the original Work); may be empty.
          items: {$ref: "#/components/schemas/RelatedWorkView"}
        lyrics_versions:
          type: array
          description: >-
            Published LyricsVersions ordered performable before reading_translation,
            then language_tag, label, and id. Body is rights-aware.
          items: {$ref: "#/components/schemas/SongLyricsVersionView"}
    WorkCreditRole:
      type: string
      enum: [composer, lyricist, writer, translator, adapter, arranger, other]
    WorkRelationType:
      type: string
      enum: [translation_of, adaptation_of, arrangement_of, medley_of]
    LyricsUsageKind:
      type: string
      enum: [performable, reading_translation]
    LyricsCreationMethod:
      type: string
      enum: [original, human_translation, machine_translation]
    RecordingOverviewResponse:
      type: object
      additionalProperties: false
      required: [id, title, period, description, isrc, first_release_date, works, credits, genres, lyrics, listening_guide, origin_badges]
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        title: {type: string, minLength: 1}
        period: {$ref: "#/components/schemas/SongPeriodView"}
        description: {$ref: "#/components/schemas/NullableText"}
        isrc: {$ref: "#/components/schemas/NullableText"}
        first_release_date: {type: "null"}
        works:
          type: array
          items: {$ref: "#/components/schemas/RecordingWorkView"}
        credits:
          type: array
          items: {$ref: "#/components/schemas/RecordingCreditView"}
        genres:
          type: array
          items: {$ref: "#/components/schemas/GenreSummary"}
        lyrics:
          type: array
          items: {$ref: "#/components/schemas/RecordingLyricsVersionView"}
        listening_guide:
          oneOf:
            - {$ref: "#/components/schemas/ListeningGuideView"}
            - {type: "null"}
        origin_badges:
          type: array
          items: {type: string}
    RecordingWorkView:
      type: object
      additionalProperties: false
      required: [work, usage_kind, position]
      properties:
        work: {$ref: "#/components/schemas/SongSummary"}
        usage_kind: {type: string, enum: [complete, partial, medley_component]}
        position: {oneOf: [{type: integer, minimum: 1}, {type: "null"}]}
    RecordingCreditView:
      type: object
      additionalProperties: false
      required: [target_kind, target, billing_role, contribution_kind, instrument, credited_as]
      properties:
        target_kind: {type: string, enum: [person, group]}
        target:
          oneOf:
            - {$ref: "#/components/schemas/PerformerSummary"}
            - {$ref: "#/components/schemas/GroupSummary"}
        billing_role: {type: string, enum: [primary, featured, additional, unbilled, unknown]}
        contribution_kind: {oneOf: [{type: string}, {type: "null"}]}
        instrument: {$ref: "#/components/schemas/NullableText"}
        credited_as: {$ref: "#/components/schemas/NullableText"}
    RecordingLyricsVersionView:
      type: object
      additionalProperties: false
      required: [id, language_tag, label, creation_method, body, body_unavailable_reason, position, confirmed_for_recording]
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        language_tag: {type: string, minLength: 1}
        label: {$ref: "#/components/schemas/NullableText"}
        creation_method: {$ref: "#/components/schemas/LyricsCreationMethod"}
        body: {$ref: "#/components/schemas/NullableText"}
        body_unavailable_reason: {$ref: "#/components/schemas/NullableText"}
        position: {oneOf: [{type: integer, minimum: 1}, {type: "null"}]}
        confirmed_for_recording: {type: boolean}
    ListeningGuideView:
      type: object
      additionalProperties: false
      required: [observations]
      properties:
        observations:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/ListeningObservationView"}
    ListeningObservationView:
      type: object
      additionalProperties: false
      required: [feature, explanation, context, position, start_seconds, end_seconds]
      properties:
        feature: {type: string, minLength: 1}
        explanation: {type: string, minLength: 1}
        context: {$ref: "#/components/schemas/NullableText"}
        position: {type: integer, minimum: 1}
        start_seconds: {oneOf: [{type: integer, minimum: 0}, {type: "null"}]}
        end_seconds: {oneOf: [{type: integer, minimum: 1}, {type: "null"}]}
    LyricsVersionRelationType:
      type: string
      enum: [translation_of, adaptation_of]
    PerformerListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Published Performer summaries ordered by canonical name.
          items: {$ref: "#/components/schemas/PerformerSummary"}
    PerformerOverviewResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - aliases
        - biography
        - birth_date
        - death_date
        - external_identities
        - primary_image
        - genres
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        name: {type: string, minLength: 1}
        aliases:
          type: array
          description: Alternate names; may be empty. Does not include the canonical name.
          items: {type: string, minLength: 1}
        biography: {$ref: "#/components/schemas/NullableText"}
        birth_date:
          oneOf:
            - $ref: "#/components/schemas/TemporalBound"
            - type: "null"
        death_date:
          oneOf:
            - $ref: "#/components/schemas/TemporalBound"
            - type: "null"
        external_identities:
          type: array
          description: External identity records; may be empty.
          items: {$ref: "#/components/schemas/ExternalIdentityView"}
        primary_image:
          oneOf:
            - $ref: "#/components/schemas/PublicImageView"
            - type: "null"
        genres:
          type: array
          description: Published Genre summaries assigned to the Performer, ordered by canonical name.
          items: {$ref: "#/components/schemas/GenreSummary"}
    ExternalIdentityView:
      type: object
      additionalProperties: false
      required: [provider, identifier, url]
      properties:
        provider: {type: string, minLength: 1}
        identifier: {type: string, minLength: 1}
        url:
          oneOf:
            - {type: string, format: uri}
            - type: "null"
    GenreOverviewResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - definition
        - primary_image
        - period
        - geography_or_origin
        - historical_context
        - formation
        - characteristic_features
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        name: {type: string, minLength: 1}
        definition: {type: string, minLength: 1, contentMediaType: text/plain}
        primary_image:
          oneOf:
            - $ref: "#/components/schemas/PublicImageView"
            - type: "null"
        period:
          oneOf:
            - $ref: "#/components/schemas/HistoricalPeriodView"
            - type: "null"
        geography_or_origin:
          oneOf:
            - $ref: "#/components/schemas/GeographicContextView"
            - type: "null"
        historical_context: {$ref: "#/components/schemas/NullableText"}
        formation: {$ref: "#/components/schemas/NullableText"}
        characteristic_features:
          type: array
          items: {type: string, minLength: 1}
    GenreRelationsResponse:
      type: object
      additionalProperties: false
      required: [genre_id, relations]
      properties:
        genre_id: {$ref: "#/components/schemas/PublicId"}
        relations:
          type: array
          description: Public relations ordered by temporal start, relation type, and related Genre name.
          items: {$ref: "#/components/schemas/GenreRelationView"}
    GenreSourcesResponse:
      type: object
      additionalProperties: false
      required: [genre_id, sources]
      properties:
        genre_id: {$ref: "#/components/schemas/PublicId"}
        sources:
          type: array
          description: Deduplicated bibliography ordered by first public citation occurrence.
          items: {$ref: "#/components/schemas/SourceView"}
    GenreSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        name: {type: string, minLength: 1}
    PerformerSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        name: {type: string, minLength: 1}
    GenreRelationView:
      type: object
      additionalProperties: false
      required:
        - id
        - related_genre
        - relation_type
        - perspective
        - explanation
        - temporal_context
        - geographic_context
        - evidence_status
        - evidence_references
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        related_genre: {$ref: "#/components/schemas/GenreSummary"}
        relation_type: {$ref: "#/components/schemas/GenreRelationType"}
        perspective: {$ref: "#/components/schemas/RelationPerspective"}
        explanation:
          type: string
          minLength: 1
          contentMediaType: text/plain
          description: >-
            Explains the relation. For disputed status it must also describe the
            material disagreement; a generic statement that sources differ is insufficient.
        temporal_context: {$ref: "#/components/schemas/HistoricalPeriodView"}
        geographic_context: {$ref: "#/components/schemas/GeographicContextView"}
        evidence_status: {$ref: "#/components/schemas/EvidenceStatus"}
        evidence_references:
          type: array
          description: Reviewed public Evidence only; may be empty for unverified.
          items: {$ref: "#/components/schemas/EvidenceReferenceView"}
    GenreRelationType:
      type: string
      enum: [influenced, contributed_to_emergence_of, developed_from, overlaps_with, revival_of]
    RelationPerspective:
      type: string
      description: Read-model perspective, not a domain relation type.
      enum: [subject, target, symmetric]
    HistoricalPeriodView:
      type: object
      additionalProperties: false
      required: [label, start, end]
      properties:
        label: {type: string, minLength: 1, description: Editorial wording displayed verbatim by the client.}
        start:
          oneOf:
            - $ref: "#/components/schemas/TemporalBound"
            - type: "null"
        end:
          oneOf:
            - $ref: "#/components/schemas/TemporalBound"
            - type: "null"
    TemporalBound:
      type: object
      additionalProperties: false
      required: [year, precision]
      properties:
        year: {type: integer, description: Anchor year interpreted together with precision.}
        precision: {$ref: "#/components/schemas/TemporalPrecision"}
    TemporalPrecision:
      type: string
      enum: [exact_year, circa_year, decade, early_decade, mid_decade, late_decade]
    GeographicContextView:
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary: {type: string, minLength: 1, contentMediaType: text/plain}
    EvidenceStatus:
      type: string
      enum: [unverified, supported, disputed]
    EvidenceRole:
      type: string
      enum: [supports, opposes, context]
    EvidenceReferenceView:
      type: object
      additionalProperties: false
      required: [source_id, role, locator_text, external_url]
      properties:
        source_id: {$ref: "#/components/schemas/PublicId"}
        role: {$ref: "#/components/schemas/EvidenceRole"}
        locator_text: {$ref: "#/components/schemas/NullableText"}
        external_url:
          oneOf:
            - {type: string, format: uri}
            - type: "null"
    SourceView:
      type: object
      additionalProperties: false
      required: [id, title, author, responsible_organization, publication, publication_date, external_url]
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        title: {type: string, minLength: 1}
        author: {$ref: "#/components/schemas/NullableText"}
        responsible_organization: {$ref: "#/components/schemas/NullableText"}
        publication: {$ref: "#/components/schemas/NullableText"}
        publication_date: {$ref: "#/components/schemas/NullableText"}
        external_url:
          oneOf:
            - {type: string, format: uri}
            - type: "null"
    PublicImageView:
      type: object
      additionalProperties: false
      required: [id, url, alt_text, width, height, attribution_text, attribution_url]
      properties:
        id: {$ref: "#/components/schemas/PublicId"}
        url: {type: string, format: uri}
        alt_text: {type: string, minLength: 1}
        width:
          oneOf:
            - {type: integer, minimum: 1}
            - type: "null"
        height:
          oneOf:
            - {type: integer, minimum: 1}
            - type: "null"
        attribution_text: {$ref: "#/components/schemas/NullableText"}
        attribution_url:
          oneOf:
            - {type: string, format: uri}
            - type: "null"
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, details, request_id]
      properties:
        code: {type: string, minLength: 1, description: Stable machine-readable error code.}
        message: {type: string, minLength: 1, description: Safe user-facing message without internal details.}
        details:
          oneOf:
            - {type: object, additionalProperties: true}
            - type: "null"
        request_id: {$ref: "#/components/schemas/NullableText"}
